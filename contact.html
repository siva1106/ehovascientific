<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | ehova Scientific</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <header class="site-header">
        <div class="container nav-container">
<!-- LOGO AND TEXT TOGETHER -->
            <a href="index.html" class="logo brand-wrap">
                <img src="assets/logo.png" alt="ehova ScientificLogo" class="site-logo">
                <span class="brand-text">Ehovascientific</span>
            </a>            <button class="mobile-menu-toggle" id="menu-btn">☰</button>
            <nav class="main-nav" id="main-nav">
                <a href="index.html">Home</a>
                <a href="solutions.html">Solutions</a>
                <a href="about.html">About</a>
                <a href="contact.html" class="btn-outline" style="background-color: var(--primary-color); color: white !important;">Contact Us</a>
            </nav>
        </div>
    </header>

    <!-- INNER PAGE HEADER -->
    <div class="page-header">
        <div class="container">
            <h1>Start a Conversation</h1>
            <p>Let's discuss how custom software can elevate your research.</p>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <section class="solutions" style="background-color: var(--white);">
        <div class="container" style="max-width: 600px; text-align: left;">
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" placeholder="Dr. Jane Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Work Email</label>
                    <input type="email" id="email" placeholder="jane@laboratory.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Project Details</label>
                    <textarea id="message" rows="5" placeholder="Tell us about the software you need..." required></textarea>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; border: none; font-size: 1rem; cursor: pointer;">Send Message</button>
            </form>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="container footer-content">
            <div class="footer-info">
                <h2>ehova Scientific</h2>
                <p>hello@ehovascientific.com</p>
            </div>
        </div>
        <div class="footer-bottom">
    <p>&copy; 2026 Ehovascientific. All rights reserved.</p>
</div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
